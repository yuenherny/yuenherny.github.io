# Link checker config (https://lychee.cli.rs/), used by .github/workflows/ci.yml.

# Skip the local-run example in README.md.
exclude_loopback = true

# These sites block automated requests (LinkedIn returns 999, Medium 403),
# so they can't be checked from CI.
exclude = ['^https://(www\.)?linkedin\.com/', '^https://([a-z0-9-]+\.)?medium\.com/']

# Streamlit Community Cloud answers bots with a 303 redirect to its auth page.
accept = ["200..=299", "303"]
